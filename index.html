<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Soundboard</title>
<style>
:root{--bg:#14131a;--panel:#1e1c27;--panel2:#262434;--line:#363348;--text:#e9e6f2;--dim:#9a96ad;--accent:#b794f6;--amb:#5fd0c4;--good:#5fd08a;--bad:#ef6b73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,Segoe UI,sans-serif;padding-bottom:200px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#16111f;border-color:var(--accent);font-weight:600}
input,select,textarea{background:#17151f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;width:100%}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;flex:1}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:70vh;text-align:center;padding:20px}
#start p{color:var(--dim);max-width:420px;margin:0}
#start button{font-size:20px;padding:16px 34px}
#app{display:none}
#scenes{max-width:1700px;margin:0 auto;padding:16px;display:grid;gap:14px}

/* split view: music left, ambience right */
.split{display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr);gap:0 14px;align-items:stretch}
.vbar,.vbar2{background:#4a4566;border-radius:3px}
.colh{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.col[data-c="1"] .colh{color:var(--amb)}
.sceneblock{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.scenehead{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.sname{font-weight:700;font-size:16px}
.sdesc{color:var(--dim);font-size:13px}
.shead{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px}
.tile{min-height:84px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;gap:3px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile .ttitle{font-size:15px;font-weight:600;line-height:1.2;word-break:break-word}
.tile .tdesc{color:var(--dim);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.active{background:#3a2f5c;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile:active{transform:scale(.97)}
.col[data-c="1"] .tile{background:#1c2a2e;border-color:#2c4a50}
.col[data-c="1"] .tile.active{background:#1f4a52;border-color:var(--amb);box-shadow:0 0 0 1px var(--amb) inset}
@media(max-width:1300px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.split{grid-template-columns:1fr}.vbar,.vbar2{display:none}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* edit mode */
details.scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.scene>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.scene>summary::-webkit-details-marker{display:none}
.tracks{border-top:1px solid var(--line)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bad);color:var(--bad)}
.editrow{display:grid;grid-template-columns:2fr 1.2fr 2fr 120px auto;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.addrow{background:var(--panel2)}
.sedit{display:grid;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.empty{padding:14px;color:var(--dim)}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;z-index:10}
.barsplit{display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr);gap:0 14px;max-width:1700px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:12px}
.now{flex:1;min-width:0}
.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--dim);font-size:13px}
.now .cl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.half[data-c="1"] .now .cl{color:var(--amb)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.ctl input[type=range]{width:130px;padding:0}
.ctl select{width:auto}
.players{display:flex;gap:8px;margin-top:6px}
.pbox{width:150px;height:84px;background:#000;border-radius:6px;overflow:hidden;position:relative}
.pbox>div,.pbox iframe{width:100%;height:100%}
@media(max-width:850px){.barsplit{grid-template-columns:1fr;gap:8px}.half[data-c="1"]{display:block}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>

<div id="start">
  <h1>Soundboard</h1>
  <p>Browsers block audio until you click something. Press once to begin, then the scene menu opens.</p>
  <button class="primary" id="startBtn">Start session</button>
</div>

<div id="app">
  <header>
    <h1>Soundboard</h1>
    <label class="ctl">Fade <input type="range" id="fadeSec" min="1" max="15" value="4"><span id="fadeLbl">4s</span></label>
    <label class="ctl">Music ends
      <select id="mode"><option value="loop">Loop it</option><option value="next">Next in scene</option></select>
    </label>
    <button id="editBtn">Edit mode</button>
    <button id="syncBtn">Sync from repo</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </header>
  <div id="scenes"></div>
</div>

<div id="bar">
  <div class="barsplit">
    <div class="half" data-c="0">
      <div class="hrow">
        <div class="now"><span class="cl">Music</span><b id="nowTitle0">Nothing playing</b><span id="nowSub0"></span></div>
        <label class="ctl">Vol <input type="range" id="vol0" min="0" max="100" value="70"></label>
        <button id="stop0">Fade out</button>
      </div>
      <div class="players"><div class="pbox"><div id="yt0"></div></div><div class="pbox"><div id="yt1"></div></div></div>
    </div>
    <div class="vbar2"></div>
    <div class="half" data-c="1">
      <div class="hrow">
        <div class="now"><span class="cl">Ambience</span><b id="nowTitle1">Nothing playing</b><span id="nowSub1"></span></div>
        <label class="ctl">Vol <input type="range" id="vol1" min="0" max="100" value="40"></label>
        <button id="stop1">Fade out</button>
      </div>
      <div class="players"><div class="pbox"><div id="yt2"></div></div><div class="pbox"><div id="yt3"></div></div></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const KEY='soundboard-v1';
let state=load()||{scenes:[],closed:[]};
/* Two channels (0 music, 1 ambience), two YouTube players each: players 0,1 and 2,3. */
let edit=false;
let cur=[-1,-1], nowScene=[null,null], fadeT=[null,null];
let loaded=[null,null,null,null], lvl=[0,0,0,0], ready=[false,false,false,false], players=[null,null,null,null];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAmb=t=>t&&t.layer==='ambience';

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(m,ok){const t=$('toast');t.style.background=ok?'#2f8f57':'';t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4000)}

function videoId(u){
  u=(u||'').trim();
  if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function findTrack(tid){for(const s of state.scenes){const t=s.tracks.find(x=>x.id===tid);if(t)return{s,t}}return null}

/* YouTube players */
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';
tag.onerror=()=>setStatus('YouTube script was blocked or you are offline','Check ad blocker, Edge tracking prevention, and your connection, then reload.');
document.head.appendChild(tag);
function setStatus(a,b){const t=$('nowTitle0'),s=$('nowSub0');if(t)t.textContent=a;if(s)s.textContent=b||''}
setStatus('Loading YouTube players...','');
setTimeout(()=>{
  if(ready.every(Boolean))return;
  if(location.protocol==='file:')setStatus('Players failed to start','Opened as a local file. Host the page (GitHub Pages) and open it from its https link.');
  else setStatus('Players failed to start','YouTube is blocked on this page. Pause ad blockers, set Edge tracking prevention to Basic for this site, then reload.');
},8000);
window.onYouTubeIframeAPIReady=function(){
  for(let i=0;i<4;i++){
    players[i]=new YT.Player('yt'+i,{width:'100%',height:'100%',
      playerVars:Object.assign({playsinline:1,rel:0},/^https?:$/.test(location.protocol)?{origin:location.origin,widget_referrer:location.href}:{}),
      events:{onReady:()=>{ready[i]=true;players[i].setVolume(0);if(ready.every(Boolean))updateNow()},onStateChange:e=>onState(i,e),onError:e=>onErr(i,e)}});
  }
};
function onState(i,e){
  const c=i>>1;
  if(e.data===0&&i===cur[c]){
    if(c===0&&$('mode').value==='next')playNext();
    else{players[i].seekTo(0);players[i].playVideo()}
  }
  if(e.data===1&&i===cur[c]){
    const t=loaded[i];
    if(t&&t.status==='failed'){t.status='ok';save();render()}
  }
}
function onErr(i,e){
  const t=loaded[i];
  if(t){t.status='failed';save();render();toast('Failed to load: '+(t.title||t.url)+' (code '+e.data+')')}
}

/* Playback */
function playTrack(tid){
  const f=findTrack(tid);if(!f)return;
  const c=isAmb(f.t)?1:0,a=c*2,b=c*2+1;
  if(!ready[a]||!ready[b]){toast('Players still loading, try again in a second');return}
  /* tapping the ambience tile that is already playing switches it off */
  if(c===1&&cur[1]>=0&&loaded[cur[1]]&&loaded[cur[1]].id===tid){fadeOutCh(1);return}
  const id=videoId(f.t.url);
  if(!id){f.t.status='failed';save();render();toast('Not a valid YouTube link');return}
  const n=cur[c]<0?a:(cur[c]===a?b:a);
  lvl[n]=0;players[n].setVolume(0);players[n].loadVideoById(id);
  loaded[n]=f.t;cur[c]=n;nowScene[c]=f.s.id;
  f.t.status='';
  startFade(c);updateNow();render();
}
function playableMusic(s){return s.tracks.filter(t=>!isAmb(t)&&t.status!=='failed'&&videoId(t.url))}
function playScene(sid){
  const s=state.scenes.find(x=>x.id===sid);if(!s)return;
  const ok=playableMusic(s);
  if(!ok.length){toast('No playable music tracks in this scene');return}
  playTrack(ok[Math.floor(Math.random()*ok.length)].id);
}
function playNext(){
  const s=state.scenes.find(x=>x.id===nowScene[0]);if(!s)return;
  const ok=playableMusic(s);
  if(!ok.length)return;
  const i=ok.indexOf(loaded[cur[0]]);
  playTrack(ok[(i+1)%ok.length].id);
}
function fadeOutCh(c){cur[c]=-1;nowScene[c]=null;startFade(c);updateNow();render()}

function startFade(c){
  clearInterval(fadeT[c]);
  const a=c*2,b=c*2+1,pair=[a,b];
  const from=lvl.slice(),t0=performance.now(),ms=$('fadeSec').value*1000;
  const tick=()=>{
    const k=Math.min(1,(performance.now()-t0)/ms);
    for(const i of pair){
      if(i===cur[c])lvl[i]=from[i]+(1-from[i])*Math.sin(k*Math.PI/2);
      else lvl[i]=from[i]*Math.cos(k*Math.PI/2);
    }
    applyVol(c);
    if(k>=1){
      clearInterval(fadeT[c]);
      for(const i of pair)if(i!==cur[c]){lvl[i]=0;applyVol(c);try{players[i].stopVideo()}catch(e){}}
    }
  };
  fadeT[c]=setInterval(tick,50);
  tick();
}
function applyVol(c){
  const m=$('vol'+c).value/100;
  for(const i of [c*2,c*2+1])if(ready[i])players[i].setVolume(Math.round(lvl[i]*m*100));
}
function updateNow(){
  for(const c of [0,1]){
    const t=cur[c]>=0?loaded[cur[c]]:null;
    const s=state.scenes.find(x=>x.id===nowScene[c]);
    $('nowTitle'+c).textContent=t?(t.title||t.url):'Nothing playing';
    $('nowSub'+c).textContent=t&&s?s.name:'';
  }
}

/* Rendering */
function colHtml(c,playing){
  const parts=state.scenes.map(s=>{
    const ts=s.tracks.filter(t=>isAmb(t)===!!c);
    if(!ts.length)return '';
    const tiles=ts.map(t=>`<button class="tile ${playing.has(t.id)?'active':''}" data-act="play" data-tid="${t.id}">
        <span class="ttitle">${esc(t.title||t.url)}</span>
        <span class="tdesc">${esc(t.desc)}</span>
        ${t.status==='failed'?'<span class="badge">Failed to load</span>':''}
      </button>`).join('');
    return `<div class="sceneblock"><div class="scenehead">
        <div class="shead"><div class="sname">${esc(s.name)}</div><div class="sdesc">${esc(s.desc)}</div></div>
        ${c?'':`<button class="primary" data-act="playscene" data-sid="${s.id}">Play scene</button>`}
      </div><div class="grid">${tiles}</div></div>`;
  }).join('');
  const none=c?'No ambience tracks yet. In Edit mode, set a track to Ambience.':'No music tracks yet.';
  return `<section class="col" data-c="${c}"><h2 class="colh">${c?'Ambience':'Music'}</h2>${parts||`<div class="empty">${none}</div>`}</section>`;
}
function layerSel(attr,val){
  return `<select ${attr}><option value="music"${val!=='ambience'?' selected':''}>Music</option><option value="ambience"${val==='ambience'?' selected':''}>Ambience</option></select>`;
}
function render(){
  const root=$('scenes');
  if(!state.scenes.length){
    root.innerHTML='<div class="empty">No scenes yet. Turn on Edit mode and add one.</div>'+(edit?'<button data-act="addscene">+ Add scene</button>':'');
    return;
  }
  if(!edit){
    const playing=new Set([0,1].map(c=>cur[c]>=0&&loaded[cur[c]]?loaded[cur[c]].id:null));
    root.innerHTML=`<div class="split">${colHtml(0,playing)}<div class="vbar"></div>${colHtml(1,playing)}</div>`;
    return;
  }
  root.innerHTML=state.scenes.map(s=>{
    const open=!state.closed.includes(s.id)?'open':'';
    const tracks=s.tracks.map(t=>
      `<div class="editrow">
        <input data-f="url" data-tid="${t.id}" value="${esc(t.url)}" placeholder="YouTube link">
        <input data-f="title" data-tid="${t.id}" value="${esc(t.title)}" placeholder="Title">
        <input data-f="desc" data-tid="${t.id}" value="${esc(t.desc)}" placeholder="Description">
        ${layerSel(`data-f="layer" data-tid="${t.id}"`,t.layer)}
        <button data-act="deltrack" data-tid="${t.id}">Delete</button>
      </div>`).join('')||'<div class="empty">No tracks.</div>';
    const add=`<div class="editrow addrow" data-sid="${s.id}">
        <input data-n="url" placeholder="YouTube link"><input data-n="title" placeholder="Title"><input data-n="desc" placeholder="Description">
        ${layerSel('data-n="layer"','music')}
        <button data-act="addtrack" data-sid="${s.id}">Add track</button></div>`;
    const sedit=`<div class="sedit">
        <input data-sf="name" data-sid="${s.id}" value="${esc(s.name)}" placeholder="Scene name">
        <input data-sf="desc" data-sid="${s.id}" value="${esc(s.desc)}" placeholder="Scene description">
        <div><button data-act="delscene" data-sid="${s.id}">Delete scene</button></div></div>`;
    return `<details class="scene" data-sid="${s.id}" ${open}>
      <summary><div class="shead"><div class="sname">${esc(s.name)}</div><div class="sdesc">${esc(s.desc)}</div></div></summary>
      <div class="tracks">${tracks}${add}</div>${sedit}</details>`;
  }).join('')+'<button data-act="addscene">+ Add scene</button>';
}

$('scenes').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,sid=b.dataset.sid,tid=b.dataset.tid;
  if(a==='playscene'){e.preventDefault();playScene(sid)}
  else if(a==='play')playTrack(tid);
  else if(a==='addscene'){state.scenes.push({id:uid(),name:'New scene',desc:'',tracks:[]});save();render()}
  else if(a==='delscene'){
    if(b.dataset.armed){state.scenes=state.scenes.filter(s=>s.id!==sid);save();render()}
    else{b.dataset.armed='1';b.textContent='Tap again to delete';b.classList.add('primary');
      setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Delete scene';b.classList.remove('primary')}},3000)}
  }
  else if(a==='deltrack'){const f=findTrack(tid);if(f){f.s.tracks=f.s.tracks.filter(t=>t.id!==tid);save();render()}}
  else if(a==='addtrack'){
    const row=b.closest('.addrow'),g=n=>row.querySelector('[data-n='+n+']').value.trim();
    if(!videoId(g('url'))){toast('Paste a valid YouTube link first');return}
    const s=state.scenes.find(x=>x.id===sid);
    s.tracks.push({id:uid(),url:g('url'),title:g('title'),desc:g('desc'),layer:g('layer')==='ambience'?'ambience':'music',status:''});save();render();
  }
});
$('scenes').addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f){const f=findTrack(el.dataset.tid);if(f){f.t[el.dataset.f]=el.value;if(el.dataset.f==='url')f.t.status='';save()}}
  else if(el.dataset.sf){const s=state.scenes.find(x=>x.id===el.dataset.sid);if(s){s[el.dataset.sf]=el.value;save()}}
});
$('scenes').addEventListener('toggle',e=>{
  const d=e.target;if(!d.dataset||!d.dataset.sid)return;
  const i=state.closed.indexOf(d.dataset.sid);
  if(d.open&&i>=0)state.closed.splice(i,1);
  if(!d.open&&i<0)state.closed.push(d.dataset.sid);
  save();
},true);

/* Controls */
$('startBtn').onclick=()=>{$('start').style.display='none';$('app').style.display='block';render()};
$('editBtn').onclick=()=>{edit=!edit;$('editBtn').textContent=edit?'Done editing':'Edit mode';render()};
$('vol0').oninput=()=>applyVol(0);
$('vol1').oninput=()=>applyVol(1);
$('fadeSec').oninput=()=>$('fadeLbl').textContent=$('fadeSec').value+'s';
$('stop0').onclick=()=>fadeOutCh(0);
$('stop1').onclick=()=>fadeOutCh(1);
$('exportBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
  a.download='soundboard.json';a.click();
};
async function fetchRepo(){
  const r=await fetch('soundboard.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  if(!Array.isArray(d.scenes))throw new Error('bad file');
  return d;
}
function useRepo(d){
  state={scenes:d.scenes,closed:d.closed||[]};
  state.scenes.forEach(s=>s.tracks.forEach(t=>t.status=''));
  save();render();
}
$('syncBtn').onclick=async()=>{
  const b=$('syncBtn');
  if(!b.dataset.armed){
    b.dataset.armed='1';b.textContent='Tap again: replace local scenes';b.classList.add('primary');
    setTimeout(()=>{delete b.dataset.armed;b.textContent='Sync from repo';b.classList.remove('primary')},4000);
    return;
  }
  delete b.dataset.armed;b.textContent='Sync from repo';b.classList.remove('primary');
  try{useRepo(await fetchRepo());toast('Synced from repo',true)}
  catch(e){toast('Could not load soundboard.json from the repo')}
};
if(!state.scenes.length){fetchRepo().then(useRepo).catch(()=>{})}
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.scenes))throw 0;state={scenes:d.scenes,closed:d.closed||[]};save();render()}catch(x){toast('That file is not a valid soundboard export')}};
  r.readAsText(f);
};
</script>
</body>
</html>
